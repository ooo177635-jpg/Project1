<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Tree Links</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>My Link Tree</h1>
        
        <div class="tree-container">
            <!-- Tree trunk -->
            <div class="trunk"></div>
            
            <!-- Tree canopy with apples -->
            <div class="canopy">
                <!-- Left branch cluster -->
                <div class="branch-cluster left-cluster">
                    <a href="https://google.com" class="apple" title="Google">
                        <span class="apple-body"></span>
                        <span class="apple-stem"></span>
                        <span class="apple-leaf"></span>
                    </a>
                    <a href="https://github.com" class="apple" title="GitHub">
                        <span class="apple-body"></span>
                        <span class="apple-stem"></span>
                        <span class="apple-leaf"></span>
                    </a>
                    <a href="https://twitter.com" class="apple" title="Twitter">
                        <span class="apple-body"></span>
                        <span class="apple-stem"></span>
                        <span class="apple-leaf"></span>
                    </a>
                </div>
                
                <!-- Center branch cluster -->
                <div class="branch-cluster center-cluster">
                    <a href="https://linkedin.com" class="apple" title="LinkedIn">
                        <span class="apple-body"></span>
                        <span class="apple-stem"></span>
                        <span class="apple-leaf"></span>
                    </a>
                    <a href="https://youtube.com" class="apple" title="YouTube">
                        <span class="apple-body"></span>
                        <span class="apple-stem"></span>
                        <span class="apple-leaf"></span>
                    </a>
                    <a href="https://instagram.com" class="apple" title="Instagram">
                        <span class="apple-body"></span>
                        <span class="apple-stem"></span>
                        <span class="apple-leaf"></span>
                    </a>
                </div>
                
                <!-- Right branch cluster -->
                <div class="branch-cluster right-cluster">
                    <a href="https://reddit.com" class="apple" title="Reddit">
                        <span class="apple-body"></span>
                        <span class="apple-stem"></span>
                        <span class="apple-leaf"></span>
                    </a>
                    <a href="https://discord.com" class="apple" title="Discord">
                        <span class="apple-body"></span>
                        <span class="apple-stem"></span>
                        <span class="apple-leaf"></span>
                    </a>
                    <a href="https://twitch.tv" class="apple" title="Twitch">
                        <span class="apple-body"></span>
                        <span class="apple-stem"></span>
                        <span class="apple-leaf"></span>
                    </a>
                </div>
            </div>
        </div>
        
        <p class="instructions">Hover over the apples to see where they lead!</p>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
